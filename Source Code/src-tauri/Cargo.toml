[package]
name = "squish"
version = "1.0.1"
description = "Beautiful local video & image compressor"
authors = ["Squish contributors"]
edition = "2021"

[lib]
name = "squish_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
oxipng = { version = "9", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
