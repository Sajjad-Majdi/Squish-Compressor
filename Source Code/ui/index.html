<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Squish</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<!--
  DIRECTION CONTRACT — code-led build, user-pinned world
  THESIS: One calm screen that makes media smaller; refuses dashboard clutter — every pixel is the queue.
  OWN-WORLD: Charcoal glass studio (#0B0C10 ground, rgba-white panels), indigo→violet (#7C86FF→#A06BFF) committed to the primary action and brand marks, mint reserved for savings, Segoe UI Variable voice, tabular numerals.
  STORY: Visitor drops files, picks how hard to squeeze, presses one gradient button, watches honest numbers land — before/after sizes, resolution never touched.
  FIRST VIEWPORT: Titlebar glass strip; heading "Make media smaller." top-left with live session savings top-right; large breathing drop-zone center-stage with authored squeeze illustration; segmented quality control beneath.
  FORM: Operate tool, brief-pinned dark studio; chosen directly from user's confirmed direction.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C86FF"/><stop offset="1" stop-color="#A06BFF"/>
    </linearGradient>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M3.5 17.5l4.8-4.8a1.5 1.5 0 0 1 2.1 0l6.1 6M14.5 14l1.9-1.9a1.5 1.5 0 0 1 2.1 0l2 2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5v10a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-7l-2-2h-4a2 2 0 0 0-2 2z"/></symbol>
    <symbol id="i-reveal" viewBox="0 0 24 24"><path d="M4 17V7.5a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 15.5v-5m0 0l-2.2 2.2M12 10.5l2.2 2.2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.6"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><rect x="5.5" y="8.5" width="10" height="10" rx="1.6"/><path d="M8.8 8.5V7a1.5 1.5 0 0 1 1.5-1.5h6.7A1.5 1.5 0 0 1 18.5 7v6.7a1.5 1.5 0 0 1-1.5 1.5h-1.5"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v5"/><circle cx="12" cy="16" r=".4" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V7m3 0l-.7 11a2 2 0 0 1-2 1.9H8.7a2 2 0 0 1-2-1.9L6 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4 4L18.5 7.5"/></symbol>
  </defs>
</svg>

<div class="titlebar" data-tauri-drag-region>
  <div class="brand" data-tauri-drag-region>
    <span class="mark" data-tauri-drag-region>
      <svg viewBox="0 0 24 24" data-tauri-drag-region><path d="M8.2 12H5.4m0 0l2-2m-2 2l2 2M15.8 12h2.8m0 0l-2-2m2 2l-2 2" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="1.9" fill="#fff"/></svg>
    </span>
    <span class="brand-name" data-tauri-drag-region>Squish</span>
  </div>
  <div class="winctl">
    <button id="btn-min" title="Minimize" aria-label="Minimize"><svg><use href="#i-minus"/></svg></button>
    <button id="btn-max" title="Maximize" aria-label="Maximize"><svg><use href="#i-max" id="max-icon"/></svg></button>
    <button id="btn-close" title="Close" aria-label="Close" class="close"><svg><use href="#i-x"/></svg></button>
  </div>
</div>

<main>
  <header class="hero">
    <div class="hero-copy">
      <h1>Make media smaller.</h1>
      <p class="sub">Videos and photos squeezed to share-ready sizes. Resolution never changes.</p>
    </div>
    <div class="session hidden" id="session">
      <span class="session-num" id="session-num">0 B</span>
      <span class="session-cap">saved<br/>this session</span>
    </div>
  </header>

  <section id="dropzone" tabindex="0" role="button" aria-label="Drop files here or press Enter to browse">
    <div class="dz-art" aria-hidden="true">
      <div class="glow"></div>
      <svg viewBox="0 0 220 132" fill="none">
        <g class="bracket-l">
          <path d="M26 44v-8a8 8 0 0 1 8-8h8" stroke="url(#g-accent)" stroke-width="3" stroke-linecap="round"/>
          <path d="M26 88v8a8 8 0 0 0 8 8h8" stroke="url(#g-accent)" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g class="bracket-r">
          <path d="M194 44v-8a8 8 0 0 0-8-8h-8" stroke="url(#g-accent)" stroke-width="3" stroke-linecap="round"/>
          <path d="M194 88v8a8 8 0 0 1-8 8h-8" stroke="url(#g-accent)" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g class="frame">
          <rect x="62" y="30" width="96" height="72" rx="10" fill="rgba(124,134,255,0.10)" stroke="rgba(160,150,255,0.55)" stroke-width="1.6"/>
          <circle cx="90" cy="52" r="6.5" stroke="rgba(190,185,255,.85)" stroke-width="2"/>
          <path d="M70 92l20-19a4 4 0 0 1 5.6 0L118 95M108 84l12-11a4 4 0 0 1 5.6 0l16 15" stroke="rgba(190,185,255,.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g class="nudge-l"><path d="M40 66h14m0 0l-5-5m5 5l-5 5" stroke="#8F97FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="nudge-r"><path d="M180 66h-14m0 0l5-5m-5 5l5 5" stroke="#8F97FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      </svg>
    </div>
    <p class="dz-title">Drag files here</p>
    <p class="dz-sub">or <span class="linklike" id="browse" role="button" tabindex="0">browse your computer</span> · compression starts automatically</p>
    <p class="dz-formats">Video&nbsp; MP4 · MOV · MKV · WEBM · AVI · WMV<span class="dotsep"></span>Image&nbsp; JPG · PNG · WEBP</p>
  </section>

  <section class="controls" id="controls">
    <div class="seg" role="group" aria-label="Compression strength">
      <button data-mode="balanced" class="active" title="Great balance of size and quality">Balanced</button>
      <button data-mode="high" title="Near-original quality">High quality</button>
      <button data-mode="max" title="Smallest possible files">Max savings</button>
    </div>
    <div class="dest">
      <button id="dest-btn" class="ghost dest-btn" title="Choose output folder">
        <svg class="ic"><use href="#i-folder"/></svg>
        <span id="dest-label">Next to originals</span>
        <svg class="ic ic-sm"><use href="#i-chev"/></svg>
      </button>
      <button id="dest-reset" class="ghost icon-only hidden" title="Back to next to originals">
        <svg class="ic"><use href="#i-x"/></svg>
      </button>
    </div>
  </section>

  <ul id="list" aria-live="polite"></ul>

  <footer class="actionbar hidden" id="actionbar">
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button id="cancel-run" class="ghost danger hidden">Cancel</button>
      <button id="clear" class="ghost">
        <svg class="ic"><use href="#i-trash"/></svg><span>Clear</span>
      </button>
    </div>
  </footer>
</main>

<div id="toast-layer"></div>
<script type="module" src="main.js"></script>
</body>
</html>
